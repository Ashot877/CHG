# Copy only the sections/keys you need into your real .streamlit/secrets.toml.
# Do NOT commit the real file.

[app]
title = "Change Helper"
jira_base_url = "https://jirasd.digitain.com"
verify_jira_on_login = true

[jira]
api_version = "2"
auth_type = "Bearer"
user_payload_type = "name"

[manual_field_ids]
internal_reporter = ""
waiting_information_from = ""

# Existing [users.<name>] sections stay exactly as in your current secrets.toml.
# Example only:
# [users.ashot]
# password = "APP_PASSWORD"
# display_name = "Ashot"
# jira_auth_type = "Bearer"
# jira_username = "ashot.mkrtchyan"
# jira_token = "JIRA_PAT"
# default_current_person = "ashot.mkrtchyan"

[partner_tier]
# Normal weekly flow uses an uploaded Word (.doc/.docx), Excel, or CSV file and needs no Confluence credentials.
# The values below are only for the optional Advanced direct-Confluence mode.
confluence_page_url = ""
confluence_base_url = ""
inherit_jira_credentials = false
confluence_auth_type = "Bearer"
confluence_username = ""
confluence_token = ""

partner_field_name = "Partner / Project"
partner_tier_field_name = "Partner tier"
partner_column_name = "Partner"
category_column_name = "Partner Category"

# Optional. If omitted, the app uses the built-in safe default JQL.
# jql = "project = \"Change Management\" AND \"Partner tier\" is EMPTY"

[partner_type]
# Optional. Defaults already match the expected Jira/Word names.
partner_field_name = "Partner / Project"
partner_type_field_name = "Partner Type"
partner_column_name = "Partner"
type_column_name = "Partner Type"

# Optional. If omitted, the app uses the built-in JQL for empty Partner Type tickets.
# jql = "project = \"Change Management\" AND \"Partner Type\" is EMPTY"
