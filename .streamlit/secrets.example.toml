# Copy only the sections/keys you need into your real .streamlit/secrets.toml.
# Do NOT commit the real file.

[app]
title = "Change Helper"
jira_base_url = "https://jirasd.digitain.com"
verify_jira_on_login = true

[jira]
api_version = "2"
auth_type = "Bearer"
user_payload_type = "name"

[manual_field_ids]
internal_reporter = ""
waiting_information_from = ""

# Existing [users.<name>] sections stay exactly as in your current secrets.toml.
# Example only:
# [users.ashot]
# password = "APP_PASSWORD"
# display_name = "Ashot"
# jira_auth_type = "Bearer"
# jira_username = "ashot.mkrtchyan"
# jira_token = "JIRA_PAT"
# default_current_person = "ashot.mkrtchyan"

[partner_tier]
# Put the actual Confluence page containing Partner + Partner Category here.
confluence_page_url = ""

# Usually auto-derived from the page URL. Set only if your Confluence has a non-standard base path.
confluence_base_url = ""

# If Confluence accepts the same Jira credentials/PAT, this is the easiest option.
inherit_jira_credentials = true

# Otherwise set dedicated Confluence credentials below and set inherit_jira_credentials = false.
confluence_auth_type = "Bearer"
confluence_username = ""
confluence_token = ""

partner_field_name = "Partner / Project"
partner_tier_field_name = "Partner tier"
partner_column_name = "Partner"
category_column_name = "Partner Category"

# Optional. If omitted, the app uses the built-in safe default JQL.
# jql = "project = \"Change Management\" AND \"Partner tier\" is EMPTY"
